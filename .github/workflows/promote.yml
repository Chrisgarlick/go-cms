# Manual promotion (security fixes skip the soak): moves a release to a channel.
name: promote
on:
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag, e.g. v1.4.2", required: true }
      channel: { description: "edge, canary or stable", required: true, default: stable }
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # edits release notes (the channel marker)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: ./scripts/promote.sh --tag "$TAG" --channel "$CHANNEL"
