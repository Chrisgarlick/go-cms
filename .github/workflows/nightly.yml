# Nightly (spec 9.6): vulnerability scans on main and the latest release,
# long fuzzing, and release-ring promotion. Skips when nothing changed.
name: nightly
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write # opens an issue when the latest release is affected
    strategy:
      matrix:
        ref: [main, latest-release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Check out the latest release tag
        if: matrix.ref == 'latest-release'
        run: git checkout "$(git describe --tags --abbrev=0)"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version-file: go.mod }
      - name: govulncheck
        id: vuln
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... | tee vuln.txt
      - name: Open an issue for a vulnerable release
        if: failure() && matrix.ref == 'latest-release'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh issue create --label security --title "Vulnerability affects the latest release" --body-file vuln.txt

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version-file: go.mod }
      - run: go test ./internal/richtext -run '^$' -fuzz FuzzRender -fuzztime 10m

  promote:
    name: Promote releases through the rings
    runs-on: ubuntu-24.04
    permissions:
      contents: write # edits release notes (the channel marker)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - name: edge -> canary after 24 h healthy on staging; canary -> stable after 72 h on your own site
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_URL: ${{ vars.STAGING_URL }}
          CANARY_URL: ${{ vars.CANARY_URL }}
        run: ./scripts/promote.sh
